[package]
name = "rust-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
actix-web = "4"
actix-rt = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9.0"
futures = "0.3"
tokio-stream = "0.1"
redis = { version = "0.32", features = ["aio", "tokio-comp"] }
chrono = { version = "0.4", features = ["alloc", "std", "serde"] }
env_logger = "0.10"